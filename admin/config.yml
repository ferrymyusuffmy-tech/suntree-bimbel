# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: ferrymyusuffmy-tech/suntree-bimbel
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/29c2462f-250d-43e5-bf91-bd548485f1f1/pkce
  auth_token_endpoint: /sites/29c2462f-250d-43e5-bf91-bd548485f1f1/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://suntreebimbel.netlify.app

media_folder: "assets/uploads"
public_folder: "assets/uploads"

locale: "id"

collections:
  - name: "gallery"
    label: "Galeri Foto"
    files:
      - name: "gallery"
        label: "Daftar Foto Galeri"
        file: "data/gallery.json"
        fields:
          - label: "Foto"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Keterangan Foto", name: "caption", widget: "string", required: false }

  - name: "blog"
    label: "Blog"
    files:
      - name: "blog"
        label: "Daftar Artikel Blog"
        file: "data/posts.json"
        fields:
          - label: "Artikel"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Judul Artikel", name: "title", widget: "string" }
              - { label: "Kategori", name: "category", widget: "string", required: false, hint: "Contoh: Tips Orang Tua, Persiapan Ujian, Cerita SunTree" }
              - { label: "Ringkasan Singkat", name: "excerpt", widget: "text" }
              - { label: "Tanggal", name: "date", widget: "string", required: false, hint: "Contoh: 12 Agustus 2026" }
              - { label: "Gambar Sampul", name: "image", widget: "image", required: false }
